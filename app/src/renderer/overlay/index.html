<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' aura: data: blob:; connect-src 'self' aura: data: blob: https:; img-src 'self' aura: data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' aura: blob: https:;" />
  <title>Partner.execute(me);</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-wall="desktop">
  <div class="stage" id="stage">

    <!-- 伙伴：渲染在桌面层窗口内（独立透明窗口在本机合成器被挂起，见 companion/pet.js） -->
    <div class="petstage" id="petStage" data-hot>
      <img id="petStill" alt="" hidden />
      <canvas id="petSpineCanvas" hidden></canvas>
      <canvas id="petVrmCanvas" hidden></canvas>
      <canvas id="petFigureCanvas" hidden></canvas>
      <div class="petstage-fallback" id="petFallback" hidden>✦</div>
    </div>
    <!-- 伙伴回复气泡：贴角色头顶浮出，流式更新后自动淡出（不要聊天框形式） -->
    <div class="petbubble" id="petBubble" hidden></div>
    <!-- 5.5 悬停按钮条已按主人要求移除（0.45.29）：桌面留白比六个按钮重要，
         右键菜单保留了全部动作（聊天/设置/主题/音效/装扮/隐藏） -->
    <!-- 5.7 窗台提示：拖拽悬在窗口顶边附近时，在那条边上亮一条线 -->
    <div class="petledge" id="petLedge" hidden></div>
    <!-- 0.18.0 第一批：右键菜单（暂停/继续、打字、设置、主题、音效、装扮、隐藏） -->
    <div class="petmenu" id="petMenu" data-hot hidden>
      <button class="petmenu-item" data-pmact="pause" id="petMenuPause">⏸ 暂停</button>
      <button class="petmenu-item" data-pmact="chat">💬 说句话</button>
      <button class="petmenu-item" data-pmact="settings">⚙ 设置</button>
      <div class="petmenu-sep"></div>
      <button class="petmenu-item" data-pmact="theme">🎨 换个主题</button>
      <button class="petmenu-item" data-pmact="sound">🔊 音效开关</button>
      <button class="petmenu-item" data-pmact="dress">👗 装扮</button>
      <div class="petmenu-sep"></div>
      <button class="petmenu-item" data-pmact="hide">🙈 先藏起来</button>
    </div>
    <!-- 状态气泡：思考/读/写/搜索/操作电脑等，小号贴角色肩侧（对齐参考项目 status.ts 三段时序） -->
    <div class="petstatus" id="petStatus" hidden><span class="petstatus-ico" id="petStatusIco"></span><span class="petstatus-text" id="petStatusText"></span></div>
    <!-- S3：模型主动提问（pet_ask）——问句 + 最多 3 个选项 + 自己回答的输入框 -->
    <div class="petask" id="petAsk" data-hot hidden>
      <div class="petask-q" id="petAskQ"></div>
      <div class="petask-opts" id="petAskOpts"></div>
      <div class="petask-own" id="petAskOwn" hidden>
        <input id="petAskInput" type="text" maxlength="200" placeholder="自己回答…" />
        <button id="petAskOk" type="button" title="发送">➤</button>
      </div>
    </div>
    <!-- 悬停角色时的聊天面板：上方显示最近对话记录（与助手聊天窗同源），下方输入 -->
    <!-- 悬停角色时的一句话输入条：回复显示在角色头顶的气泡里，不做缩小版聊天框 -->
    <div class="petchat" id="petChat" data-hot hidden>
      <div class="petchat-row">
        <button class="petchat-mic" id="petManageBtn" title="打开 Partner.execute(me);（完整界面：聊天 / 角色 / 形象 / 语音）">⚙</button>
        <button class="petchat-mic" id="petMic" title="语音捕捉开关">🎤</button>
        <textarea id="petChatInput" rows="1" placeholder="和 TA 说点什么…"></textarea>
        <button class="petchat-send" id="petSendBtn" title="发送">➤</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
  <script src="../shared/speech-filter.js"></script>
  <!-- 0.45.98 台词清洗（剥「（QQ）」前缀 / 括号译文）——系统语音兜底那条路也要用 -->
  <script src="../../shared/reply-text.js"></script>
  <script src="../shared/figure-render.js"></script>
  <script src="../shared/anim-catalog.js"></script>
  <script src="../shared/anim-pool.js"></script>
  <script src="../shared/vrm-stage.js"></script>
  <script src="../companion/libs.js"></script>
  <script src="../shared/spine-words.js"></script>
  <script src="../shared/spine-actions.js"></script>
  <script src="../shared/spine-skin.js"></script>
  <script src="pet.js"></script>
  <script src="app.js"></script>
</body>
</html>
